spring:
  application:
    name: academia
  datasource:
    url: jdbc:postgresql://localhost:5432/academia
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:abcdefg1234567hijklmn8910opqrstuvwxyz}
    expiracao-minutos: 60
  admin:
    senha: ${ADMIN_SENHA:admin12345}

logging:
  level:
    org.springframework.security: TRACE