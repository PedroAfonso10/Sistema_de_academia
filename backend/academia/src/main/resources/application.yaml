spring:
  application:
    name: academia
  datasource:
    url: jdbc:postgresql://localhost:5432/academia
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET}
    expiracao-minutos: 60
  admin:
    cpf: ${ADMIN_CPF}
    email: ${ADMIN_EMAIL}
    senha: ${ADMIN_SENHA}

logging:
  level:
    org.springframework.security: TRACE